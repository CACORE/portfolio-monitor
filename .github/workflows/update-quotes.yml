name: 更新市場報價

on:
  schedule:
    # 台灣時間週一至週五 08:00–14:50，每 10 分鐘更新一次。
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_quotes.py
      - name: Commit changed quotes
        run: |
          if git diff --quiet -- quotes.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quotes.json
          git commit -m "chore: update market quotes"
          git push
